# Simple + fast CI/CD. On every push to main:
#   1. deploy the backend on Alternate Clouds at this commit
#   2. deploy the n8n server (EC2): git pull + docker compose up
#   3. health check the new backend
#   4. unhealthy → report an incident to n8n (agents investigate, Slack asks to approve rollback)
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AF_TOKEN: ${{ secrets.AF_TOKEN }}
      AF_PROJECT_ID: ${{ secrets.AF_PROJECT_ID }}
      AF_BACKEND_SERVICE_ID: ${{ secrets.AF_BACKEND_SERVICE_ID }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      INCIDENT_WEBHOOK_URL: ${{ vars.INCIDENT_WEBHOOK_URL }}
      INCIDENT_WEBHOOK_TOKEN: ${{ secrets.INCIDENT_WEBHOOK_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Remember the commit live now (rollback target)
        run: |
          prev=$(curl -fsS -m 15 "$BACKEND_URL/version" | jq -r '.commit // empty' || true)
          case "$prev" in ''|unknown|null) prev="${{ github.event.before }}";; esac
          echo "PREVIOUS_SHA=$prev" >> "$GITHUB_ENV"

      - name: Deploy backend (Alternate Clouds)
        run: |
          npm install -g @alternatefutures/acc@1.10.0 >/dev/null
          acc services env set "$AF_BACKEND_SERVICE_ID" GIT_SHA "$GITHUB_SHA"
          acc services rebuild "$AF_BACKEND_SERVICE_ID" --sha "$GITHUB_SHA"

      # A server problem must not send the agents to roll back a healthy backend,
      # so this step can fail without triggering the incident report.
      - name: Deploy n8n server (EC2)
        id: server
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          for v in SSH_KEY SERVER_USER SERVER_HOST; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is empty (SERVER_SSH_KEY / SERVER_USER / SERVER_HOST)"; exit 1; }
          done
          SERVER="$SERVER_USER@$SERVER_HOST"
          # Strip Windows line endings: a .pem pasted from Windows otherwise makes ssh exit 255.
          install -m 600 /dev/null ~/key && printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/key
          ssh-keygen -y -f ~/key >/dev/null || { echo "::error::SERVER_SSH_KEY is not a valid private key"; exit 1; }
          # Re-import the n8n workflow only when it changed (that restarts n8n).
          N8N_CHANGED=$(git diff --name-only HEAD~1 HEAD -- n8n/ | wc -l)
          ssh -i ~/key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$SERVER" "
            set -e
            cd ~/agentika-2
            git fetch -q origin main && git reset -q --hard origin/main
            sudo docker compose up -d --build --remove-orphans
            if [ $N8N_CHANGED -gt 0 ]; then bash scripts/enable-cicd.sh '$INCIDENT_WEBHOOK_TOKEN'; fi
            sudo docker compose ps --format '{{.Service}}: {{.Status}}'
          "
          rm -f ~/key

      - name: Health check
        id: health
        run: bash scripts/ci/health-check.sh

      - name: Start the automation (report incident)
        if: failure() && steps.health.outcome == 'failure'
        run: bash scripts/ci/report-incident.sh

      - name: Server deploy failed
        if: steps.server.outcome == 'failure'
        run: |
          echo "::error::n8n server deploy failed (SSH). Check SERVER_* secrets and that EC2 port 22 allows GitHub runners."
          exit 1
