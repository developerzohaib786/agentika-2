# Fast CI/CD (~2-3 min). On every push to main:
#   1. build the backend image here (cached) → ghcr.io/<owner>/agentika-backend:<sha>
#   2. Alternate Clouds pulls + runs that image (no source build there)
#   3. n8n server (EC2): git pull + compose up, only when server files changed
#   4. health check → unhealthy: report an incident to n8n (agents → fix PR → Slack rollback button)
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/agentika-backend
      AF_TOKEN: ${{ secrets.AF_TOKEN }}
      AF_PROJECT_ID: ${{ secrets.AF_PROJECT_ID }}
      AF_BACKEND_SERVICE_ID: ${{ secrets.AF_BACKEND_SERVICE_ID }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      INCIDENT_WEBHOOK_URL: ${{ vars.INCIDENT_WEBHOOK_URL }}
      INCIDENT_WEBHOOK_TOKEN: ${{ secrets.INCIDENT_WEBHOOK_TOKEN }}
      DEPLOY_TIMEOUT_SEC: 420
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Remember the commit live now (rollback target)
        run: |
          prev=$(curl -fsS -m 15 "$BACKEND_URL/version" | jq -r '.commit // empty' || true)
          case "$prev" in ''|unknown|null) prev="${{ github.event.before }}";; esac
          echo "PREVIOUS_SHA=$prev" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy backend (Alternate Clouds pulls the image)
        run: |
          npm install -g @alternatefutures/acc@1.10.0 >/dev/null
          acc services env set "$AF_BACKEND_SERVICE_ID" GIT_SHA "$GITHUB_SHA"
          acc services deploy "$AF_BACKEND_SERVICE_ID" --image "$IMAGE:$GITHUB_SHA" -y

      # Only when server files changed. A server problem must not send the agents
      # to roll back a healthy backend, so this step can fail without an incident.
      - name: Deploy n8n server (EC2)
        id: server
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- incident-mcp docker-compose.yml Caddyfile n8n scripts/enable-cicd.sh | wc -l)
          [ "$CHANGED" -gt 0 ] || { echo "No server files changed, skipping."; exit 0; }
          for v in SSH_KEY SERVER_USER SERVER_HOST; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is empty (SERVER_SSH_KEY / SERVER_USER / SERVER_HOST)"; exit 1; }
          done
          install -m 600 /dev/null ~/key && printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/key
          N8N_CHANGED=$(git diff --name-only HEAD~1 HEAD -- n8n/ | wc -l)
          ssh -i ~/key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$SERVER_USER@$SERVER_HOST" "
            set -e
            cd ~/agentika-2
            git fetch -q origin main && git reset -q --hard origin/main
            sudo docker compose up -d --build --remove-orphans
            if [ $N8N_CHANGED -gt 0 ]; then bash scripts/enable-cicd.sh '$INCIDENT_WEBHOOK_TOKEN'; fi
            sudo docker compose ps --format '{{.Service}}: {{.Status}}'
          "
          rm -f ~/key

      - name: Health check
        id: health
        run: bash scripts/ci/health-check.sh

      - name: Start the automation (report incident)
        if: failure() && steps.health.outcome == 'failure'
        run: bash scripts/ci/report-incident.sh

      - name: Server deploy failed
        if: steps.server.outcome == 'failure'
        run: |
          echo "::error::n8n server deploy failed (SSH). Check SERVER_* secrets and that EC2 port 22 allows GitHub runners."
          exit 1
